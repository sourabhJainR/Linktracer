<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Linktracer Capture</title>
  <style>body{font:14px system-ui,sans-serif;min-width:320px;margin:0;padding:16px;color:#172033}h1{font-size:18px;margin:0 0 12px}label{display:block;font-weight:600;margin:10px 0 5px}input,button{box-sizing:border-box;width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px}button{margin-top:12px;background:#172033;color:white;cursor:pointer}.hint{display:block;margin-top:8px;color:#64748b;font-size:12px}</style>
</head>
<body>
  <h1>Save to Linktracer</h1>
  <label for="endpoint">Linktracer address</label>
  <input id="endpoint" type="url" placeholder="http://localhost:8787/" autocomplete="url">
  <button id="save" type="button">Save current page</button>
  <span id="status" class="hint" role="status" aria-live="polite"></span>
  <script src="popup.js"></script>
</body>
</html>
