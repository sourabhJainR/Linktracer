<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Offline-first personal link library">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <title>Linktracer</title>
</head>
<body>
<header class="topbar">
  <div><h1>Linktracer</h1><span id="status">Starting...</span></div>
  <div class="actions"><button id="syncBtn">Sync</button><button id="exportBtn" type="button">Export</button><button id="importBtn" type="button">Import</button><input id="importFile" type="file" accept="application/json" hidden></div>
</header>
<main>
  <section class="capture card">
    <form id="captureForm">
      <input id="url" type="url" placeholder="Paste a link" required autocomplete="url">
      <input id="title" type="text" placeholder="Title (optional)">
      <textarea id="description" rows="3" placeholder="Description or why you saved it"></textarea>
      <div class="row"><input id="tags" type="text" placeholder="Tags, comma separated"><button type="submit">Save link</button></div>
    </form>
    <p id="enrichment" class="hint">Context, classification and suggested tags are added when connected.</p>
  </section>
  <section class="toolbar">
    <div class="searchBox"><input id="search" type="search" placeholder="Search, or use tag:ai type:article domain:github.com health:broken duplicate:true"><button id="clearSearch" type="button">Clear</button></div>
    <select id="typeFilter" aria-label="Content type"><option value="">All types</option><option>article</option><option>code</option><option>documentation</option><option>paper</option><option>video</option><option>social</option><option>product</option><option>webpage</option></select>
    <select id="healthFilter" aria-label="Link health"><option value="">All health</option><option value="healthy">Healthy</option><option value="broken">Broken</option><option value="unchecked">Unchecked</option></select>
    <span id="count"></span>
  </section>
  <section id="summary" class="summary"></section>
  <section id="links" class="grid"></section>
</main>
<script src="/app.js" type="module"></script>
</body>
</html>
